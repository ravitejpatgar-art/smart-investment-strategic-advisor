services:
  # FastAPI Backend Service
  - type: web
    name: smartvest-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    rootDir: backend
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: smartvest-db
          property: connectionString
      - key: BACKEND_CORS_ORIGINS
        value: '["https://smart-investment-strategic-advisor.vercel.app","http://localhost:5173","http://127.0.0.1:5173"]'
      # Angel One SmartAPI Credentials (populated securely in Render Dashboard)
      - key: ANGEL_API_KEY
        sync: false
      - key: ANGEL_CLIENT_CODE
        sync: false
      - key: ANGEL_PIN
        sync: false
      - key: ANGEL_TOTP
        sync: false
      - key: ANGEL_FEED_TOKEN
        sync: false

databases:
  - name: smartvest-db
    plan: free
    databaseName: smartvest
    user: smartvest
