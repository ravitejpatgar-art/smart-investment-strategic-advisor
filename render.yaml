services:
  # FastAPI Backend Service
  - type: web
    name: smartvest-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'

  # React Frontend Static Site
  - type: web
    name: smartvest-frontend
    env: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        value: https://smartvest-backend.onrender.com/api/v1
