version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - BACKEND_CORS_ORIGINS=["http://localhost:5173", "http://localhost:3000"]
    volumes:
      - ./backend/smartvest.db:/app/smartvest.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
